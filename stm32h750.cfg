# CMSIS-DAP configuration
source [find interface/cmsis-dap.cfg]

# Device identification
cmsis_dap_vid_pid 0x0d28 0x0204

# Force USB bulk interface
cmsis_dap_backend usb_bulk

# Explicit USB interface
cmsis_dap_usb interface 4

# SWD protocol
transport select swd

# STM32H750 target configuration
source [find target/stm32h7x.cfg]

# SWD frequency
adapter speed 100
